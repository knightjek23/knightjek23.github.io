<title>Spritz posting kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4EFE6;--card:#FBF8F2;--ink:#1A1A1A;--muted:#6B6960;--line:rgba(26,26,26,.10);--green:#1F3F2E;--gold:#C9A961}
@media (prefers-color-scheme:dark){:root{--paper:#16150F;--card:#1F1D17;--ink:#F1ECE2;--muted:#A6A194;--line:rgba(241,236,226,.12);--green:#4E8A69}}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:300 16px/1.45 Roboto,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header .mark{font:400 28px "Playfair Display",serif;color:var(--green);letter-spacing:-.01em}
header h1{font:400 26px/1.2 "Playfair Display",serif;margin:10px 0 6px}
header p{color:var(--muted);margin:0 0 6px;font-size:14px}
ol.how{color:var(--muted);font-size:14px;padding-left:20px;margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--line);padding:16px;margin:0 0 16px}
.card.done{opacity:.55}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.card h2{font:400 21px/1.25 "Playfair Display",serif;margin:4px 0 12px}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 12px;padding:0 16px}
.strip img{height:150px;aspect-ratio:4/5;object-fit:cover;flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--paper)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 15px Roboto,system-ui,sans-serif;border:0;padding:13px 14px;cursor:pointer;flex:1 1 140px;min-height:48px}
.save{background:var(--green);color:#fff}.copy{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button:disabled{opacity:.6}
.status{font-size:13px;color:var(--muted);min-height:18px;margin-top:8px}
label.posted{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;color:var(--muted)}
label.posted input{width:20px;height:20px;accent-color:var(--green)}
details{margin-top:10px}summary{font-size:13px;color:var(--muted);cursor:pointer}
pre{white-space:pre-wrap;font:300 13px/1.45 Roboto,system-ui,sans-serif;margin:8px 0 0}
</style></head><body><main>
<header><div class="mark">spritz</div><h1>Instagram posting kit</h1>
<p>One card per post. Each takes about a minute.</p>
<ol class="how"><li><b>Save slides</b> &rarr; choose <b>Save 10 Images</b>.</li><li><b>Copy caption</b>.</li><li>Instagram &rarr; <b>+</b> &rarr; Post &rarr; tap the 10 newest photos <b>in order</b> (1 = cover) &rarr; paste &rarr; Share.</li></ol></header>

const POSTS = [{"id": "caramel-apple-01", "day": "2026-10-21", "label": "Wed Oct 21", "title": "Perfumes that smell like a caramel apple 🍎", "caption": "Perfumes that smell like a caramel apple 🍎\n\n1. Nina Ricci Nina: amalfi lemon, lime, granny smith apple\n2. Hugo Boss Boss Bottled: apple, plum, bergamot\n3. Juicy Couture Viva la Juicy: wild berries, mandarin orange, gardenia\n4. Jimmy Choo Jimmy Choo: pear, mandarin orange, green notes\n5. Ariana Grande R.E.M.: zefir, caramel, salt\n6. Xerjoff Alexandria II: palisander rosewood, lavender, cinnamon\n7. Parfums de Marly Carlisle: nutmeg, green apple, saffron\n8. Kayali Fragrances Eden Juicy Apple | 01 Eau De Parfum: red apple, litchi, black currant\n\nSave this for your next sample order. Which one's your pick?\n\np.s. I kept blind buying, so I built Spritz. Scan any bottle and see what's actually in it. Free on iPhone.\n\n#fragrancecommunity #perfumecollection #gourmandperfume #fallfragrance #cozyscents", "imgs": ["../ig/caramel-apple-01/01.png", "../ig/caramel-apple-01/02.png", "../ig/caramel-apple-01/03.png", "../ig/caramel-apple-01/04.png", "../ig/caramel-apple-01/05.png", "../ig/caramel-apple-01/06.png", "../ig/caramel-apple-01/07.png", "../ig/caramel-apple-01/08.png", "../ig/caramel-apple-01/09.png", "../ig/caramel-apple-01/10.png"]}, {"id": "underrated-01", "day": "2026-10-22", "label": "Thu Oct 22", "title": "Underrated perfumes nobody talks about 🤫", "caption": "Underrated perfumes nobody talks about 🤫\n\n1. Serge Lutens Ambre Sultan: resins, amber, bay leaf\n2. Casamorati 1888 Mefisto: grapefruit, bergamot, amalfi lemon\n3. L'Artisan Parfumeur Timbuktu: mango, pink pepper, cardamom\n4. Guerlain Tonka Imperiale: bitter almond, rosemary, bergamot\n5. Comme des Garcons Black Eau de Toilette: incense, black pepper, olibanum\n6. Penhaligon's Sartorial: metallic notes, aldehydes, cardamon\n7. Hermès Bel Ami: sage, bergamot, cardamom\n8. Creed Carmina: black cherry, saffron, pink pepper\n\nSave this for your next sample order. Which one's your pick?\n\np.s. I kept blind buying, so I built Spritz. Scan any bottle and see what's actually in it. Free on iPhone.\n\n#fragrancecommunity #perfumecollection #underratedperfume #hiddengem #nicheperfume", "imgs": ["../ig/underrated-01/01.png", "../ig/underrated-01/02.png", "../ig/underrated-01/03.png", "../ig/underrated-01/04.png", "../ig/underrated-01/05.png", "../ig/underrated-01/06.png", "../ig/underrated-01/07.png", "../ig/underrated-01/08.png", "../ig/underrated-01/09.png", "../ig/underrated-01/10.png"]}, {"id": "sea-salt-skin-01", "day": "2026-10-23", "label": "Fri Oct 23", "title": "Perfumes that smell like sea salt skin 🌊", "caption": "Perfumes that smell like sea salt skin 🌊\n\n1. Jo Malone London Wood Sage & Sea Salt: sea salt, sage, grapefruit\n2. Maison Martin Margiela Beach Walk: bergamot, lemon, pink pepper\n3. Orto Parisi Megamare: bergamot, lemon, seaweed\n4. Creed Millésime Impérial: sea salt, fruity notes, sicilian lemon\n5. Ellis Brooklyn Salt: ylang-ylang, violet leaves, tiare flower\n6. Xerjoff 40 Knots: woody notes, cedar, salt\n7. Maison Martin Margiela Sailing Day: sea notes, aldehydes, coriander\n8. Tom Ford Costa Azzurra: driftwood, seaweed, agarwood (oud)\n\nSave this for your next sample order. Which one's your pick?\n\np.s. I kept blind buying, so I built Spritz. Scan any bottle and see what's actually in it. Free on iPhone.\n\n#fragrancecommunity #perfumecollection #beachperfume #saltyscents #freshfragrance", "imgs": ["../ig/sea-salt-skin-01/01.png", "../ig/sea-salt-skin-01/02.png", "../ig/sea-salt-skin-01/03.png", "../ig/sea-salt-skin-01/04.png", "../ig/sea-salt-skin-01/05.png", "../ig/sea-salt-skin-01/06.png", "../ig/sea-salt-skin-01/07.png", "../ig/sea-salt-skin-01/08.png", "../ig/sea-salt-skin-01/09.png", "../ig/sea-salt-skin-01/10.png"]}, {"id": "ski-lodge-01", "day": "2026-10-24", "label": "Sat Oct 24", "title": "Perfumes that smell like a ski lodge ⛷️", "caption": "Perfumes that smell like a ski lodge ⛷️\n\n1. Tom Ford Tobacco Vanille: tobacco leaf, spicy notes, vanilla\n2. Hermès Terre d'Hermès: orange, grapefruit, pepper\n3. Byredo Gypsy Water: juniper, lemon, bergamot\n4. Ralph Lauren Polo: juniper berries, basil, artemisia\n5. Coty Aspen: green notes, bergamot, lemon\n6. Burberry Hero Eau de Parfum: pine needles, olibanum, benzoin\n7. Givenchy Gentlemen Only: pink pepper, green mandarin, birch leaf\n8. Amouage Decision: cardamom, bergamot, pink pepper\n\nSave this for your next sample order. Which one's your pick?\n\np.s. I kept blind buying, so I built Spritz. Scan any bottle and see what's actually in it. Free on iPhone.\n\n#fragrancecommunity #perfumecollection #winterfragrance #woodyperfume #cozyscents", "imgs": ["../ig/ski-lodge-01/01.png", "../ig/ski-lodge-01/02.png", "../ig/ski-lodge-01/03.png", "../ig/ski-lodge-01/04.png", "../ig/ski-lodge-01/05.png", "../ig/ski-lodge-01/06.png", "../ig/ski-lodge-01/07.png", "../ig/ski-lodge-01/08.png", "../ig/ski-lodge-01/09.png", "../ig/ski-lodge-01/10.png"]}, {"id": "hotel-spa-01", "day": "2026-10-25", "label": "Sun Oct 25", "title": "Perfumes that smell like a luxury hotel spa 🧖", "caption": "Perfumes that smell like a luxury hotel spa 🧖\n\n1. Elizabeth Arden Green Tea: lemon, bergamot, mint\n2. Acqua di Parma Acqua di Parma Blu Mediterraneo - Fico di Amalfi: grapefruit, bergamot, citron\n3. Guerlain Aqua Allegoria Herba Fresca: lemon, clover, mint\n4. Le Labo The Matcha 26: fig, cedar, matcha tea\n5. Aesop Hwyl: spices, thyme, cypress\n6. Elizabeth Arden White Tea: sea notes, fern, clary sage\n7. Bvlgari Eau Parfumee au The Blanc: tea, artemisia, bergamot\n8. Hermès Eau d'Orange Verte: orange, amalfi lemon, oakmoss\n\nSave this for your next sample order. Which one's your pick?\n\np.s. I kept blind buying, so I built Spritz. Scan any bottle and see what's actually in it. Free on iPhone.\n\n#fragrancecommunity #perfumecollection #spaday #teaperfume #freshfragrance", "imgs": ["../ig/hotel-spa-01/01.png", "../ig/hotel-spa-01/02.png", "../ig/hotel-spa-01/03.png", "../ig/hotel-spa-01/04.png", "../ig/hotel-spa-01/05.png", "../ig/hotel-spa-01/06.png", "../ig/hotel-spa-01/07.png", "../ig/hotel-spa-01/08.png", "../ig/hotel-spa-01/09.png", "../ig/hotel-spa-01/10.png"]}, {"id": "smells-expensive-01", "day": "2026-10-26", "label": "Mon Oct 26", "title": "Perfumes that smell expensive but aren’t 💎", "caption": "Perfumes that smell expensive but aren’t 💎\n\n1. Lalique Encre Noire: cypress, vetiver, cashmere wood\n2. Calvin Klein Euphoria: pomegranate, persimmon, green accord\n3. Calvin Klein CK One: lemon, green notes, bergamot\n4. Davidoff Cool Water: sea water, lavender, mint\n5. Rochas Moustache Eau de Parfum: pink pepper, mandarin orange, atlas cedar\n6. Nautica Nautica Voyage: green leaves, apple, lotus\n7. Britney Spears Fantasy: kiwi, red litchi, quince\n8. Elizabeth Arden 5th Avenue: lily-of-the-valley, lime (linden blossom), lilac\n\nSave this for your next sample order. Which one's your pick?\n\np.s. I kept blind buying, so I built Spritz. Scan any bottle and see what's actually in it. Free on iPhone.\n\n#fragrancecommunity #perfumecollection #affordableperfume #budgetfragrance #smellexpensive", "imgs": ["../ig/smells-expensive-01/01.png", "../ig/smells-expensive-01/02.png", "../ig/smells-expensive-01/03.png", "../ig/smells-expensive-01/04.png", "../ig/smells-expensive-01/05.png", "../ig/smells-expensive-01/06.png", "../ig/smells-expensive-01/07.png", "../ig/smells-expensive-01/08.png", "../ig/smells-expensive-01/09.png", "../ig/smells-expensive-01/10.png"]}];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const files={};
async function prep(p){ if(files[p.id]) return files[p.id];
  files[p.id]=Promise.all(p.imgs.map(async(u,i)=>{const r=await fetch(u,{cache:"force-cache"}); if(!r.ok) throw new Error("slide "+(i+1)+" missing");
    const b=await r.blob(); return new File([b],`${p.id}-${String(i+1).padStart(2,"0")}.png`,{type:b.type||"image/png"});}));
  files[p.id].catch(()=>{delete files[p.id]}); return files[p.id]; }
function el(t,c,txt){const e=document.createElement(t); if(c) e.className=c; if(txt!=null) e.textContent=txt; return e;}
const list=document.getElementById("list");
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){prep(POSTS[+e.target.dataset.i]).catch(()=>{}); io.unobserve(e.target);}}),{rootMargin:"200px"}):null;
POSTS.forEach((p,i)=>{
  const c=el("section","card"); c.dataset.i=i;
  const key="posted:"+p.id; if(store.get(key)==="1") c.classList.add("done");
  c.append(el("div","eyebrow",p.label+" · 10 AM"), el("h2",null,p.title));
  const s=el("div","strip"); p.imgs.forEach((u,n)=>{const im=el("img"); im.src=u; im.loading="lazy"; im.alt="Slide "+(n+1); s.append(im);}); c.append(s);
  const row=el("div","row"), save=el("button","save","Save 10 slides"), copy=el("button","copy","Copy caption"), st=el("div","status");
  save.onclick=async()=>{
    st.textContent="Preparing slides…";
    let fs; try{ fs=await prep(p);}catch(e){ st.textContent="Couldn't load the slides ("+e.message+"). Check your connection and try again."; return; }
    if(navigator.canShare && navigator.canShare({files:fs})){
      try{ await navigator.share({files:fs}); st.textContent="Saved. Now copy the caption."; }
      catch(e){ st.textContent = e.name==="AbortError" ? "" : "Slides are ready. Tap Save 10 slides again."; }
    } else {
      fs.forEach((f,n)=>setTimeout(()=>{const a=el("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.append(a); a.click(); a.remove();},n*350));
      st.textContent="Downloading 10 slides (this browser can't use the share sheet).";
    }
  };
  copy.onclick=async()=>{
    try{ await navigator.clipboard.writeText(p.caption); }
    catch(e){ const t=el("textarea"); t.value=p.caption; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    st.textContent="Caption copied.";
  };
  row.append(save,copy); c.append(row,st);
  const lab=el("label","posted"), cb=el("input"); cb.type="checkbox"; cb.checked=store.get(key)==="1";
  cb.onchange=()=>{store.set(key,cb.checked?"1":"0"); c.classList.toggle("done",cb.checked);};
  lab.append(cb, document.createTextNode("Posted")); c.append(lab);
  const det=el("details"); det.append(el("summary",null,"Show caption"), el("pre",null,p.caption)); c.append(det);
  list.append(c); if(io) io.observe(c);
});
</script></body></html>
